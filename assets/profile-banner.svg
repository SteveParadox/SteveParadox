<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
<title id="title">Xaven — AI Engineer and Software Architect</title>
<desc id="desc">Dark premium developer banner in navy, cyan, and violet with geometric network and a code panel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091323"/>
    <stop offset="52%" stop-color="#101A33"/>
    <stop offset="100%" stop-color="#18143A"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#52E3D4"/>
    <stop offset="55%" stop-color="#55B9F3"/>
    <stop offset="100%" stop-color="#B286F6"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1A2A43" stop-opacity=".97"/>
    <stop offset="100%" stop-color="#181D39" stop-opacity=".96"/>
  </linearGradient>
  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#8FC7E8" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="31"/>
  </filter>
</defs>
<rect width="1400" height="390" rx="24" fill="url(#bg)"/>
<rect width="1400" height="390" rx="24" fill="url(#grid)"/>
<circle cx="1380" cy="25" r="180" fill="#7D68E8" opacity=".20" filter="url(#glow)"/>
<circle cx="530" cy="390" r="160" fill="#14B8A6" opacity=".12" filter="url(#glow)"/>
<path d="M60 64 H118" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
<circle cx="75" cy="105" r="5" fill="#62E1D2"/>
<text x="93" y="111" fill="#8CAAC7" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="4">STEVE PARADOX / @STEVEPARADOX</text>
<text x="66" y="208" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="91" letter-spacing="-4">XAVEN</text>
<rect x="68" y="228" width="420" height="4" rx="2" fill="url(#accent)"/>
<text x="68" y="278" fill="#D7E4F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600">AI ENGINEERING  /  SOFTWARE ARCHITECTURE</text>
<text x="68" y="320" fill="#93ACC7" font-family="Arial, Helvetica, sans-serif" font-size="22">Intelligent products. Reliable systems. Thoughtful code.</text>
<!-- Glass code panel -->
<rect x="845" y="58" width="482" height="274" rx="18" fill="url(#panel)" stroke="#5C6F98" stroke-opacity=".48" stroke-width="1.5"/>
<rect x="845" y="58" width="482" height="48" rx="18" fill="#23324F" fill-opacity=".70"/>
<path d="M845 88 H1327" stroke="#58708A" opacity=".3"/>
<circle cx="876" cy="83" r="6" fill="#FF8695"/>
<circle cx="898" cy="83" r="6" fill="#FFD27B"/>
<circle cx="920" cy="83" r="6" fill="#6EE7B7"/>
<text x="1180" y="89" fill="#93ABC8" font-family="monospace" font-size="14">engineer.ts</text>
<text x="886" y="151" fill="#90A7CE" font-family="monospace" font-size="20">const </text>
<text x="954" y="151" fill="#65DBCE" font-family="monospace" font-size="20">build</text>
<text x="1021" y="151" fill="#D4DDF6" font-family="monospace" font-size="20"> = {</text>
<text x="910" y="190" fill="#B7C7EB" font-family="monospace" font-size="20">focus:</text>
<text x="987" y="190" fill="#A894FA" font-family="monospace" font-size="20">"AI + Systems"</text>
<text x="1205" y="190" fill="#D4DDF6" font-family="monospace" font-size="20">,</text>
<text x="910" y="228" fill="#B7C7EB" font-family="monospace" font-size="20">method:</text>
<text x="1000" y="228" fill="#65DBCE" font-family="monospace" font-size="20">"Design → Build"</text>
<text x="910" y="266" fill="#B7C7EB" font-family="monospace" font-size="20">standard:</text>
<text x="1026" y="266" fill="#FFCD88" font-family="monospace" font-size="20">"Ship well"</text>
<text x="886" y="303" fill="#D4DDF6" font-family="monospace" font-size="20">};</text>
<path d="M1340 355 L1360 355 M1350 345 L1350 365" stroke="#5B9AB7" stroke-opacity=".55" stroke-width="2"/>
<rect x="1" y="1" width="1398" height="388" rx="23" fill="none" stroke="#4D6A91" stroke-opacity=".32" stroke-width="2"/>
</svg>